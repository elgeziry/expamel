name: EGX v2 comprehensive scan

on:
  push:
    paths:
      - '.github/workflows/egx-v2-comprehensive-scan.yml'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Netlify v2 market and reference stocks
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://egx-market-feed-v2.netlify.app'
          echo '=== HEALTH ==='
          curl -fsSL "$BASE/api/health" | jq -c '{status,version,checked_at,session_status,source,timestamp_kind,capabilities,probes}'
          echo '=== MARKET ==='
          curl -fsSL "$BASE/api/market" | jq -c '{status,version,retrieved_at,session_status,market,capabilities,count,total_count}'
          echo '=== SCREEN_TOP ==='
          curl -fsSL "$BASE/api/screen" | jq -c '{status,version,retrieved_at,session_status,capabilities,top_setup:[.top_setup[]|{symbol,name:(.description//.name),last_price:.close,change_percent:.change,value,relative_volume_10d,demand_confirmation_score,long_term_trend,distance_from_sma200_pct,event_risk,decision_support}],early_movement:[.early_movement[]|{symbol,name:(.description//.name),last_price:.close,change_percent:.change,value,relative_volume_10d,demand_confirmation_score,long_term_trend,distance_from_sma200_pct,event_risk,decision_support,early_movement_flags}]}'
          echo '=== EXACT_STOCKS ==='
          for s in EFIH EFID BONY JUFO SVCE ORWE AMOC MICH MASR SWDY KORA ETEL ORHD ORAS GOUR IFAP ARCC MCQE; do
            curl -fsSL "$BASE/api/stock?symbol=$s" | jq -c '{symbol,name,status,last_price,session_open,session_high,session_low,volume,change_percent,value,market_cap,technical,fundamentals,event_risk,demand_confirmation_score,session_status,decision_support,capabilities}'
          done
