name: EGX v2 comprehensive scan
# manual retrigger requested on 2026-09-13 12:09 Riyadh

on:
  push:
    paths:
      - '.github/workflows/egx-v2-comprehensive-scan.yml'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fetch Netlify v2 market and reference stocks
        shell: bash
        run: |
          set -uo pipefail
          BASE='https://egx-market-feed-v2.netlify.app'
          C='curl -fsSL --connect-timeout 5 --max-time 25 --retry 1'
          echo '=== HEALTH ==='
          $C "$BASE/api/health" | jq -c '{status,version,checked_at,session_status,source,timestamp_kind,capabilities,probes}' || echo '{"status":"health_failed"}'
          echo '=== MARKET ==='
          $C "$BASE/api/market" | jq -c '{status,version,retrieved_at,session_status,market,capabilities,count,total_count}' || echo '{"status":"market_failed"}'
          echo '=== SCREEN_TOP ==='
          $C "$BASE/api/screen" | jq -c '{status,version,retrieved_at,session_status,capabilities,top_setup:[(.top_setup//[])[]|{symbol,name:(.description//.name),last_price:.close,change_percent:.change,value,relative_volume_10d,demand_confirmation_score,long_term_trend,distance_from_sma200_pct,event_risk,decision_support}],early_movement:[(.early_movement//[])[]|{symbol,name:(.description//.name),last_price:.close,change_percent:.change,value,relative_volume_10d,demand_confirmation_score,long_term_trend,distance_from_sma200_pct,event_risk,decision_support,early_movement_flags}]}' || echo '{"status":"screen_failed"}'
          echo '=== EXACT_STOCKS ==='
          export BASE
          printf '%s\n' EFIH EFID BONY JUFO SVCE ORWE AMOC MICH MASR SWDY EGAL CLHO KORA ETEL ORHD ORAS GOUR IFAP ARCC MCQE EFIC POUL TMGH MPCO EPCO SKPC \
            | xargs -I{} -P10 bash -c 'r=$(curl -fsSL --connect-timeout 5 --max-time 18 --retry 1 "$BASE/api/stock?symbol={}" 2>/dev/null) && printf "%s\n" "$r" | jq -c '"'"'{symbol,name,status,last_price,session_open,session_high,session_low,volume,change_percent,value,market_cap,technical,fundamentals,event_risk,demand_confirmation_score,session_status,decision_support,capabilities}'"'"' || echo '"'"'{"symbol":"{}","status":"fetch_failed"}'"'"''
