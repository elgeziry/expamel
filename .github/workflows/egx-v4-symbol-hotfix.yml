name: EGX V4 canonical symbol hotfix

'on':
  push:
    branches: [master]
    paths:
      - '.github/workflows/egx-v4-symbol-hotfix.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Correct EGX canonical focus symbols
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/egx-hotfix
          git clone -q "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/egx-hotfix
          cd /tmp/egx-hotfix
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          FILE='.github/workflows/egx-resilient-bridge.yml'
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/egx-resilient-bridge.yml')
          s=p.read_text()
          old='FOCUS_SYMBOLS: EFIH,IFCM,EFID,EGAL,AMOC,JUFO,ORWE,SVCE,MASR,ORAS,BNYN,BONY,MFPC,ABUK,ETEL,ORHD,HELI,TMGH,VLMRA,KABO,ATQA,MPCO'
          new='FOCUS_SYMBOLS: EFIH,ICFC,EFID,EGAL,AMOC,JUFO,ORWE,SVCE,MASR,ORAS,BONY,MFPC,ABUK,ETEL,ORHD,HELI,TMGH,VLMRA,KABO,ATQA,MPCO'
          if old not in s:
              raise SystemExit('Expected focus list not found; refusing blind edit')
          s=s.replace(old,new,1)
          s=s.replace("alias={'BONY':'BNYN'}", "alias={'BNYN':'BONY','IFCM':'ICFC'}", 1)
          p.write_text(s)
          PY
          git add "$FILE"
          git commit -q -m 'Fix EGX canonical tickers BONY and ICFC in V4 bridge'
          git push -q origin master
