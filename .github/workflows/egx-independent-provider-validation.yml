name: EGX independent provider integration validation
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/egx-independent-provider-validation.yml'
      - 'tools/egx_independent_source.py'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Test fail-closed buy gate with six offline regression scenarios
        run: python3 -m unittest discover -s tools -p 'test_egx_independent_source.py' -v
      - name: Retrieve published EGX engine state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/egx-independent-fixture
          for file in contract.json universe.json history.json capital-recovery-alerts-v1.json; do
            curl -fsSL --retry 3 --retry-delay 1 "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/egx-live/$file?ts=${GITHUB_RUN_ID}" -o "/tmp/egx-independent-fixture/$file"
          done
      - name: Verify real independent source and timestamp session correlation
        run: python3 tools/egx_independent_source.py --root /tmp/egx-independent-fixture
      - name: Assert gate is actually enforced
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.fully_independent_provider == true and .source_quotes_are_delayed == true and (.quotes|length) == 5 and .buy_triggers_after <= .buy_triggers_before' /tmp/egx-independent-fixture/independent-quote-audit.json
          jq -e '.independent_source_gate.enforces_buy_trigger_gate == true' /tmp/egx-independent-fixture/capital-recovery-alerts-v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: egx-independent-source-diagnostics
          path: /tmp/egx-independent-fixture/independent-quote-audit.json
          retention-days: 7
