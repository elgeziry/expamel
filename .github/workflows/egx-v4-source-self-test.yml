name: EGX V4 source-change production self-test

'on':
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'egx-market-feed-v2/netlify/functions/**'
      - 'egx-market-feed-v2/netlify.toml'
      - 'egx-market-feed-v2/package.json'
      - 'egx-market-feed-v2/package-lock.json'
      - '.github/workflows/egx-v4-source-self-test.yml'

permissions:
  contents: read

concurrency:
  group: egx-v4-source-self-test
  cancel-in-progress: true

env:
  BASE_URL: https://egx-market-feed-v2.netlify.app
  FOCUS_SYMBOLS: EFIH,ICFC,EFID,EGAL,AMOC,JUFO,ORWE,SVCE,MASR,ORAS,BONY,MFPC,ABUK,ETEL,ORHD,HELI,TMGH,VLMRA,KABO,ATQA,MPCO

jobs:
  validate-production-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for matching Netlify production and validate V4 contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.parse, urllib.request

          base=os.environ['BASE_URL'].rstrip('/')
          focus=[s.strip().upper() for s in os.environ['FOCUS_SYMBOLS'].split(',') if s.strip()]
          query=urllib.parse.urlencode({'symbols':','.join(focus),'self_test':str(time.time_ns())})
          errors=[]

          def fetch(url, timeout=40):
              req=urllib.request.Request(url, headers={
                  'User-Agent':'EGX-V4-Source-Self-Test/1.0',
                  'Cache-Control':'no-cache',
                  'Pragma':'no-cache',
              })
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return r.status, json.load(r)

          for attempt in range(1, 9):
              try:
                  status, d=fetch(f'{base}/api/execution-bundle?{query}')
                  q=d.get('quality') or {}
                  returned={str(x.get('symbol','')).upper() for x in (d.get('stocks') or []) if x.get('symbol')}
                  missing=[s for s in focus if s not in returned]
                  checks={
                      'http_2xx': 200 <= status < 300,
                      'source_id': d.get('source_id') == 'egx-market-feed-v2',
                      'execution_usable': d.get('execution_usable') is True,
                      'no_blockers': not (d.get('blockers') or []),
                      'universe_296': (q.get('row_count') or 0) >= 296,
                      'unique_296': (q.get('unique_symbols') or 0) >= 296,
                      'close_coverage': (q.get('close_coverage_pct') or 0) >= 90,
                      'volume_coverage': (q.get('volume_coverage_pct') or 0) >= 80,
                      'focus_complete': not missing,
                      'fingerprint': isinstance(d.get('data_fingerprint_sha256'),str) and len(d.get('data_fingerprint_sha256')) == 64,
                  }
                  if all(checks.values()):
                      print(json.dumps({
                          'status':'pass',
                          'attempt':attempt,
                          'retrieved_at':d.get('retrieved_at'),
                          'session_status':d.get('session_status'),
                          'row_count':q.get('row_count'),
                          'focus_count':len(returned),
                          'warnings':d.get('warnings') or [],
                          'checks':checks,
                      }, indent=2))
                      raise SystemExit(0)
                  errors.append({'attempt':attempt,'checks':checks,'missing':missing,'blockers':d.get('blockers') or []})
              except Exception as e:
                  errors.append({'attempt':attempt,'error':f'{type(e).__name__}: {e}'})
              time.sleep(min(10*attempt,30))

          print(json.dumps({'status':'fail','attempts':errors}, indent=2))
          raise SystemExit('EGX V4 production contract self-test failed after retries')
          PY
