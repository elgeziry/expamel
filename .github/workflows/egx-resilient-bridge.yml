name: EGX resilient bridge

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/egx-resilient-bridge.yml'
      - 'egx-market-feed-v2/scripts/resilient-bridge.mjs'
  schedule:
    - cron: '*/5 7-13 * * 0-4'

permissions:
  contents: write

concurrency:
  group: egx-resilient-bridge
  cancel-in-progress: true

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore previous live acceptance state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          rm -f out/previous.json
          git fetch --force --depth=1 origin refs/heads/egx-live:refs/remotes/origin/egx-live || true
          if git cat-file -e refs/remotes/origin/egx-live:latest.json 2>/dev/null; then
            git show refs/remotes/origin/egx-live:latest.json > out/previous.json
            echo "Previous Bridge snapshot restored."
          else
            echo "No previous Bridge snapshot available; acceptance map will warm up safely."
          fi

      - name: Build canonical snapshot using two independent paths
        env:
          EGX_EXPECTED_CORE: '7.2.1'
          EGX_BRIDGE_OUT: 'out/latest.json'
          EGX_BRIDGE_HEALTH_OUT: 'out/health.json'
          EGX_PREVIOUS_SNAPSHOT: 'out/previous.json'
          EGX_REQUIRED_SYMBOLS: 'SWDY,EFIH,EFID,BONY,ORWE,MASR,EGAL,JUFO,AMOC,SVCE,ORAS'
        run: node egx-market-feed-v2/scripts/resilient-bridge.mjs

      - name: Build compact focus snapshots
        shell: bash
        run: |
          set -euo pipefail
          jq --argjson req '["SWDY","EFIH","EFID","BONY","ORWE","MASR","EGAL","JUFO","AMOC","SVCE","ORAS"]' '
            {
              bridge: .bridge,
              symbols: (
                [.data.universe[] | select(.symbol as $s | $req | index($s))]
                | map({key: .symbol, value: .})
                | from_entries
              )
            }
          ' out/latest.json > out/focus.json

      - name: Validate snapshot contract
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.bridge.name == "EGX Resilient Bridge"' out/latest.json >/dev/null
          jq -e '.bridge.data_sha256 | length == 64' out/latest.json >/dev/null
          jq -e '.data.market != null' out/latest.json >/dev/null
          jq -e '.data.screen.top_setup | type == "array"' out/latest.json >/dev/null
          jq -e '.path_health.direct.ok == true or .path_health.netlify.ok == true' out/latest.json >/dev/null
          if jq -e '.path_health.direct.ok == true' out/latest.json >/dev/null; then
            jq -e '.data.universe | type == "array" and length >= 50' out/latest.json >/dev/null
            jq -e '.bridge.symbol_coverage.complete == true' out/latest.json >/dev/null
            jq -e 'any(.data.universe[]; .symbol == "SWDY")' out/latest.json >/dev/null
            jq -e '.symbols.SWDY.symbol == "SWDY"' out/focus.json >/dev/null
            jq -e '.bridge.acceptance_map.method == "snapshot_volume_delta_by_last_price_proxy"' out/latest.json >/dev/null
            jq -e '.data.analytics_capabilities.volume_profile_proxy.same_source_only == true' out/latest.json >/dev/null
            jq -e 'all(.data.universe[]; .analytics.volume_profile.method == "snapshot_volume_delta_by_last_price_proxy")' out/latest.json >/dev/null
          fi

      - name: Publish latest snapshot to single-commit live branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/egx-live
          mkdir -p /tmp/egx-live
          cp out/latest.json /tmp/egx-live/latest.json
          cp out/health.json /tmp/egx-live/health.json
          cp out/focus.json /tmp/egx-live/focus.json
          cd /tmp/egx-live
          git init
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b egx-live
          git add latest.json health.json focus.json
          git commit -m "EGX live snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin egx-live
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
