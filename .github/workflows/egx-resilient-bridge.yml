name: EGX Resilient Bridge V4 live publisher

'on':
  workflow_dispatch:
  repository_dispatch:
    types: [egx_bridge_refresh]
  schedule:
    # Five-minute live mirror. UTC window intentionally covers Cairo summer/winter EGX hours.
    - cron: '*/5 6-12 * * 0-4'
  push:
    branches: [master]
    paths:
      - '.github/workflows/egx-resilient-bridge.yml'

permissions:
  contents: write

concurrency:
  group: egx-v4-live-publisher
  cancel-in-progress: true

env:
  PRIMARY_BASE: https://egx-market-feed-v2.netlify.app
  BRANCH_BASE: https://master--egx-market-feed-v2.netlify.app
  FOCUS_SYMBOLS: EFIH,IFCM,EFID,EGAL,AMOC,JUFO,ORWE,SVCE,MASR,ORAS,BNYN,BONY,MFPC,ABUK,ETEL,ORHD,HELI,TMGH,VLMRA,KABO,ATQA,MPCO

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Fetch, validate and build V4 live contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json, hashlib, os, time, urllib.parse, urllib.request
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          from pathlib import Path

          bases=[]
          for b in (os.environ['PRIMARY_BASE'], os.environ['BRANCH_BASE']):
              if b and b not in bases: bases.append(b.rstrip('/'))
          focus=[x.strip().upper() for x in os.environ['FOCUS_SYMBOLS'].split(',') if x.strip()]
          now=datetime.now(timezone.utc)
          cairo_now=now.astimezone(ZoneInfo('Africa/Cairo'))
          stamp=str(time.time_ns())

          def fetch_json(url, attempts=3, timeout=30):
              last=None
              for attempt in range(attempts):
                  try:
                      req=urllib.request.Request(url, headers={
                          'User-Agent':'EGX-Resilient-Bridge-V4/1.0',
                          'Cache-Control':'no-cache',
                          'Pragma':'no-cache',
                      })
                      with urllib.request.urlopen(req, timeout=timeout) as r:
                          return json.load(r)
                  except Exception as e:
                      last=e
                      time.sleep(1.2*(attempt+1))
              raise last

          def parse_time(v):
              if not v: return None
              try:
                  return datetime.fromisoformat(str(v).replace('Z','+00:00')).astimezone(timezone.utc)
              except Exception:
                  return None

          def bundle_gate(d):
              reasons=[]
              if not isinstance(d,dict): return False,['not_object'],None
              if d.get('source_id')!='egx-market-feed-v2': reasons.append('source_id')
              if d.get('execution_usable') is not True: reasons.append('execution_usable')
              if (d.get('blockers') or []): reasons.append('blockers')
              q=d.get('quality') or {}
              rows=q.get('row_count') or 0
              if rows < 50: reasons.append(f'row_count:{rows}')
              if (q.get('close_coverage_pct') or 0) < 90: reasons.append('close_coverage')
              if (q.get('volume_coverage_pct') or 0) < 80: reasons.append('volume_coverage')
              if q.get('live_session_consistent') is not True: reasons.append('session_consistency')
              ts=parse_time(d.get('retrieved_at'))
              age=None
              if not ts:
                  reasons.append('retrieved_at')
              else:
                  age=(now-ts).total_seconds()
                  phase=str(d.get('session_status') or '').lower()
                  if phase in {'auction','continuous','postclose','open','live'}:
                      if age > 600: reasons.append(f'stale:{int(age)}s')
                      if age < -180: reasons.append(f'clock_skew:{int(age)}s')
                      ref=str(d.get('expected_reference_session_date') or '')
                      if ref != cairo_now.date().isoformat(): reasons.append(f'session_date:{ref}')
              fp=d.get('data_fingerprint_sha256')
              if not (isinstance(fp,str) and len(fp)==64): reasons.append('fingerprint')
              return not reasons,reasons,age

          diagnostics=None
          bundle=None
          selected=None
          failures={}
          query=urllib.parse.urlencode({'symbols':','.join(focus),'ts':stamp})
          for base in bases:
              try:
                  try:
                      diagnostics=fetch_json(f'{base}/api/diagnostics?ts={stamp}', attempts=2, timeout=20)
                  except Exception:
                      diagnostics=None
                  candidate=fetch_json(f'{base}/api/execution-bundle?{query}', attempts=3, timeout=35)
                  ok,reasons,age=bundle_gate(candidate)
                  if ok:
                      bundle=candidate; selected=base; live_age=age
                      break
                  failures[base]=reasons
              except Exception as e:
                  failures[base]=[f'{type(e).__name__}:{e}']
          if bundle is None:
              raise SystemExit('FAIL_CLOSED: no canonical execution bundle passed the V4 gate: '+json.dumps(failures))

          # Full market is desirable for scanning/history, but it must never block a valid live focus packet.
          market_payload=None
          market_base=None
          for base in [selected]+[x for x in bases if x!=selected]:
              try:
                  raw=fetch_json(f'{base}/api/market?ts={stamp}', attempts=2, timeout=40)
                  if isinstance(raw,list):
                      parsed={'stocks':raw}
                  elif isinstance(raw,dict) and isinstance(raw.get('stocks'),list):
                      parsed=raw
                  elif isinstance(raw,dict) and isinstance(raw.get('data'),dict) and isinstance(raw['data'].get('stocks'),list):
                      parsed=raw['data']
                  elif isinstance(raw,dict) and isinstance(raw.get('rows'),list):
                      parsed={'stocks':raw['rows']}
                  elif isinstance(raw,dict) and isinstance(raw.get('data'),list):
                      parsed={'stocks':raw['data']}
                  else:
                      parsed={'stocks':[]}
                  if len(parsed.get('stocks') or []) >= 250:
                      market_payload=parsed; market_base=base; break
              except Exception:
                  pass

          # Read the last analytical history only as a sidecar. It cannot make stale execution data valid.
          history={}
          try:
              history=fetch_json(f'https://raw.githubusercontent.com/{os.environ["GITHUB_REPOSITORY"]}/egx-live/history.json?ts={stamp}', attempts=1, timeout=15)
          except Exception:
              history={}
          cycle_quality=history.get('cycle_quality') or [] if isinstance(history,dict) else []

          stocks=bundle.get('stocks') or []
          have={str(x.get('symbol','')).upper() for x in stocks}
          alias={'BONY':'BNYN'}
          focus_rows=[]
          for row in stocks:
              r=dict(row)
              sym=str(r.get('symbol','')).upper()
              r['canonical_symbol']=alias.get(sym,sym)
              if sym=='BONY': r['symbol_aliases']=['BONY','BNYN']
              if sym in focus or r['canonical_symbol'] in focus:
                  focus_rows.append(r)

          quality=dict(bundle.get('quality') or {})
          quality['bridge_live_age_seconds']=None if live_age is None else round(live_age,1)
          quality['bridge_gate']='pass'
          quality['full_market_fresh']=market_payload is not None
          quality['focus_requested']=len(focus)
          quality['focus_returned']=len(focus_rows)

          upstream_fp=bundle.get('data_fingerprint_sha256')
          bridge={
              'name':'EGX Resilient Bridge',
              'version':'4.0-live-fail-closed',
              'generated_at':bundle.get('retrieved_at'),
              'publisher_generated_at':now.isoformat().replace('+00:00','Z'),
              'transport_independent':True,
              'selected_mode':'netlify_canonical_v2',
              'market_phase':bundle.get('session_status') or 'unknown',
              'data_sha256':upstream_fp,
              'live_max_age_seconds':600,
              'history_contract':'egx-session-history-v4',
              'cycle_quality_engine':'decoupled_daily-v4',
          }
          latest={
              'bridge':bridge,
              'path_health':{
                  'netlify':{'ok':True,'base':selected,'execution_usable':True,'live_age_seconds':live_age},
                  'github_mirror':{'ok':True,'mode':'normal_non_force_commit'},
                  'full_market':{'ok':market_payload is not None,'base':market_base},
              },
              'data':{
                  'execution_usable':True,
                  'retrieved_at':bundle.get('retrieved_at'),
                  'session_status':bundle.get('session_status'),
                  'expected_reference_session_date':bundle.get('expected_reference_session_date'),
                  'stale_risk':'low' if live_age is not None and live_age<=300 else 'controlled',
                  'blockers':[],
                  'warnings':list(bundle.get('warnings') or []) + ([] if market_payload is not None else ['full_market_unavailable_focus_live_only']),
                  'quality':quality,
                  'market':bundle.get('market') or {},
                  'screen':bundle.get('screen') or {'top_setup':[]},
                  'stocks':stocks,
                  'cycle_quality':cycle_quality,
                  'history':{
                      'contract':history.get('schema','egx-session-history-v4') if isinstance(history,dict) else 'egx-session-history-v4',
                      'retention_sessions':60,
                      'source':'decoupled_daily_history',
                  },
              },
          }
          if not isinstance(latest['data']['screen'].get('top_setup'),list):
              latest['data']['screen']['top_setup']=[]

          contract={
              'source_id':bundle.get('source_id'),
              'version':bundle.get('version'),
              'retrieved_at':bundle.get('retrieved_at'),
              'session_status':bundle.get('session_status'),
              'expected_reference_session_date':bundle.get('expected_reference_session_date'),
              'execution_usable':True,
              'live_age_seconds':live_age,
              'max_live_age_seconds':600,
              'stale_risk':latest['data']['stale_risk'],
              'blockers':[],
              'warnings':latest['data']['warnings'],
              'quality':quality,
              'data_fingerprint_sha256':upstream_fp,
              'bridge_gate':'pass',
          }
          health={
              'status':'ok',
              'bridge_version':'4.0-live-fail-closed',
              'checked_at':now.isoformat().replace('+00:00','Z'),
              'selected_base':selected,
              'live_age_seconds':live_age,
              'execution_usable':True,
              'full_market_fresh':market_payload is not None,
              'diagnostics_status': (diagnostics or {}).get('status') if isinstance(diagnostics,dict) else None,
              'failures_before_success':failures,
          }
          transport={
              'transport':'github-actions-v4-non-force-mirror',
              'market_source':'EGX Market Feed V2 canonical execution bundle',
              'source_url':selected,
              'mirrored_at':now.isoformat().replace('+00:00','Z'),
              'external_market_fallback_used':False,
              'external_market_crosscheck_used':False,
              'full_market_source_url':market_base,
          }
          focus_doc={
              'retrieved_at':bundle.get('retrieved_at'),
              'session_status':bundle.get('session_status'),
              'expected_reference_session_date':bundle.get('expected_reference_session_date'),
              'execution_usable':True,
              'live_age_seconds':live_age,
              'requested_symbols':focus,
              'canonical_aliases':alias,
              'market':bundle.get('market') or {},
              'screen':bundle.get('screen') or {},
              'stocks':focus_rows,
          }
          if market_payload is not None:
              universe={
                  'retrieved_at':market_payload.get('retrieved_at') or bundle.get('retrieved_at'),
                  'session_status':market_payload.get('session_status') or bundle.get('session_status'),
                  'expected_reference_session_date':market_payload.get('expected_reference_session_date') or bundle.get('expected_reference_session_date'),
                  'universe_fresh':True,
                  'quality':market_payload.get('quality') or quality,
                  'market':market_payload.get('market') or bundle.get('market') or {},
                  'screen':market_payload.get('screen') or bundle.get('screen') or {},
                  'stocks':market_payload.get('stocks') or [],
              }
          else:
              universe={
                  'retrieved_at':bundle.get('retrieved_at'),
                  'session_status':bundle.get('session_status'),
                  'expected_reference_session_date':bundle.get('expected_reference_session_date'),
                  'universe_fresh':False,
                  'quality':{**quality,'coverage_scope':'focus_only_no_full_market'},
                  'market':bundle.get('market') or {},
                  'screen':bundle.get('screen') or {},
                  'stocks':stocks,
              }

          out=Path('out')
          for name,obj in [('latest.json',latest),('contract.json',contract),('health.json',health),('transport.json',transport),('focus.json',focus_doc),('universe.json',universe)]:
              (out/name).write_text(json.dumps(obj,ensure_ascii=False,indent=2))

          # Final local fail-closed assertions.
          assert latest['data']['execution_usable'] is True
          assert not latest['data']['blockers']
          assert contract['bridge_gate']=='pass'
          assert live_age is None or live_age <= 600
          print(json.dumps({'selected':selected,'age_seconds':live_age,'focus':len(focus_rows),'universe_rows':len(universe['stocks']),'universe_fresh':universe['universe_fresh']}))
          PY

      - name: Publish without force and retain compact intraday audit snapshots
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/egx-pub
          git init -q /tmp/egx-pub
          cd /tmp/egx-pub
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin egx-live >/dev/null 2>&1; then
            git fetch -q origin egx-live
            git checkout -q -B egx-live origin/egx-live
          else
            git checkout -q --orphan egx-live
            git rm -rf . >/dev/null 2>&1 || true
          fi

          cp "${GITHUB_WORKSPACE}/out/latest.json" latest.json
          cp "${GITHUB_WORKSPACE}/out/contract.json" contract.json
          cp "${GITHUB_WORKSPACE}/out/health.json" health.json
          cp "${GITHUB_WORKSPACE}/out/transport.json" transport.json
          cp "${GITHUB_WORKSPACE}/out/focus.json" focus.json
          cp "${GITHUB_WORKSPACE}/out/universe.json" universe.json

          SESSION="$(jq -r '.expected_reference_session_date' contract.json)"
          SNAP="$(date -u +%H%M%SZ)"
          mkdir -p "snapshots/${SESSION}"
          cp focus.json "snapshots/${SESSION}/${SNAP}.json"
          # Keep compact audit snapshots for the most recent seven session-date folders.
          if [ -d snapshots ]; then
            mapfile -t OLD < <(find snapshots -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | head -n -7)
            for d in "${OLD[@]}"; do rm -rf "snapshots/$d"; done
          fi

          git add latest.json contract.json health.json transport.json focus.json universe.json snapshots/
          if git diff --cached --quiet; then
            echo 'No bridge change; nothing to publish.'
            exit 0
          fi
          git commit -q -m "EGX V4 live snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for attempt in 1 2 3; do
            if git push origin egx-live; then
              echo 'EGX V4 live publish succeeded.'
              exit 0
            fi
            echo "Push retry ${attempt}: rebasing on latest egx-live"
            git pull --rebase origin egx-live || true
            sleep $((attempt*2))
          done
          echo 'EGX V4 live publish failed after retries' >&2
          exit 1
