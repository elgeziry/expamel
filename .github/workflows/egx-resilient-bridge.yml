name: EGX Netlify V2 transport mirror

on:
  workflow_dispatch:
  schedule:
    # One refresh per hour during the EGX daytime window; portfolio alerts read GitHub only.
    - cron: '0 7-12 * * 0-4'
  push:
    branches:
      - master
    paths:
      - '.github/workflows/egx-resilient-bridge.yml'

permissions:
  contents: write

concurrency:
  group: egx-netlify-v2-transport
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Select healthy Netlify V2 endpoint
        shell: bash
        run: |
          set -euo pipefail
          TS="$(date +%s%N)"
          CANDIDATES=(
            "https://egx-market-feed-v2.netlify.app"
            "https://master--egx-market-feed-v2.netlify.app"
          )
          BASE=""
          for candidate in "${CANDIDATES[@]}"; do
            if ping="$(curl -fsSL --connect-timeout 15 --max-time 20 --retry 1 --retry-delay 1 "${candidate}/ping.txt?ts=${TS}" 2>/dev/null)"               && [[ "${ping}" == EGX-V2-ONLINE\ 7.2.1* ]]; then
              BASE="${candidate}"
              break
            fi
          done
          test -n "${BASE}"
          echo "EGX_BASE=${BASE}" >> "${GITHUB_ENV}"
          echo "EGX_TS=${TS}" >> "${GITHUB_ENV}"
          printf '%s\n' "${BASE}" > selected-base.txt

      - name: Fetch and validate diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          curl -fsSL --connect-timeout 15 --max-time 20 --retry 1 --retry-delay 1             "${EGX_BASE}/api/diagnostics?ts=${EGX_TS}" -o out/health.json
          jq -e '
            .source_id == "egx-market-feed-v2" and
            (.version == "7.2.1" or .core_version_expected == "7.2.1") and
            .execution_usable == true and
            (.blockers | type == "array" and length == 0) and
            (.expected_reference_session_date | type == "string" and length == 10) and
            (.session_status | type == "string" and length > 0) and
            (.stale_risk | type == "string" and length > 0) and
            (.quality.row_count >= 296) and
            (.quality.unique_symbols == .quality.row_count) and
            (.quality.close_coverage_pct >= 90) and
            (.quality.volume_coverage_pct >= 80) and
            (.quality.live_session_consistent == true) and
            (.data_fingerprint_sha256 | type == "string" and test("^[a-f0-9]{64}$"))
          ' out/health.json >/dev/null

      - name: Fetch one canonical execution bundle
        shell: bash
        env:
          SYMBOLS: EFIH,EFID,ORWE,BONY,JUFO,AMOC,SVCE,EGAL,MASR,ORHD,HELI,TMGH,ABUK,VLMRA
        run: |
          set -euo pipefail
          curl -fsSL --connect-timeout 15 --max-time 60 --retry 1 --retry-delay 1             "${EGX_BASE}/api/execution-bundle?symbols=${SYMBOLS}&ts=${EGX_TS}" -o out/latest.json
          jq -e '
            .source_id == "egx-market-feed-v2" and
            .version == "7.2.1" and
            .execution_usable == true and
            (.blockers | type == "array" and length == 0) and
            (.expected_reference_session_date | type == "string" and length == 10) and
            (.session_status | type == "string" and length > 0) and
            (.market_calendar | type == "object") and
            (.stale_risk | type == "string" and length > 0) and
            (.quality.row_count >= 296) and
            (.quality.unique_symbols == .quality.row_count) and
            (.quality.close_coverage_pct >= 90) and
            (.quality.volume_coverage_pct >= 80) and
            (.quality.live_session_consistent == true) and
            (.data_fingerprint_sha256 | type == "string" and test("^[a-f0-9]{64}$"))
          ' out/latest.json >/dev/null
          jq '{source_id,version,retrieved_at,session_status,expected_reference_session_date,execution_usable,stale_risk,blockers,warnings,quality,data_fingerprint_sha256}'             out/latest.json > out/contract.json
          jq --arg base "${EGX_BASE}" --arg mirrored_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '
            {
              transport: "github-actions-netlify-v2-mirror",
              market_source: "EGX Market Feed V2.1 on Netlify only",
              source_url: $base,
              mirrored_at: $mirrored_at,
              external_market_fallback_used: false,
              external_market_crosscheck_used: false
            }
          ' <<< '{}' > out/transport.json
          jq --argjson req '["EFIH","EFID","ORWE","BONY","JUFO","AMOC","SVCE","EGAL","MASR","ORHD","HELI","TMGH","ABUK","VLMRA"]' '
            {
              retrieved_at,
              session_status,
              market,
              screen,
              stocks: (.stocks | map(select(.symbol as $s | $req | index($s))))
            }
          ' out/latest.json > out/focus.json

      - name: Preserve zero-credit session history
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Read prior history from GitHub, never from Netlify. This survives the force-published live branch.
          git init -q /tmp/history-repo
          cd /tmp/history-repo
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth=1 origin egx-live && git show FETCH_HEAD:history.json > /tmp/prior-history.json 2>/dev/null; then
            :
          else
            echo '{"schema":"egx-session-history-v1","sessions":[]}' > /tmp/prior-history.json
          fi
          cd "${GITHUB_WORKSPACE}"
          SESSION="$(jq -r '.expected_reference_session_date' out/latest.json)"
          # Store one compact end/current observation per trading date; repeated hourly runs replace the same date.
          jq --arg session "$SESSION" '
            {
              date: $session,
              retrieved_at: .retrieved_at,
              market: .market,
              stocks: [.stocks[] | {
                symbol, close, open, high, low, volume, change,
                RSI, EMA20, SMA20, SMA50, SMA200,
                relative_volume_10d,
                long_term_trend,
                close_location_in_day
              }]
            }
          ' out/latest.json > /tmp/today.json
          jq --slurpfile today /tmp/today.json --arg session "$SESSION" '
            .schema = "egx-session-history-v1"
            | .sessions = (((.sessions // []) | map(select(.date != $session))) + $today)
            | .sessions = (.sessions | sort_by(.date) | if length > 40 then .[-40:] else . end)
          ' /tmp/prior-history.json > out/history.json

      - name: Wrap V2 snapshot in EGX Resilient Bridge contract
        shell: bash
        run: |
          set -euo pipefail
          cp out/latest.json out/v2-raw.json
          SHA="$(jq -r '.data_fingerprint_sha256' out/v2-raw.json)"
          GENERATED="$(jq -r '.retrieved_at' out/v2-raw.json)"
          jq --arg sha "$SHA" --arg generated "$GENERATED" '
            {
              bridge: {
                name: "EGX Resilient Bridge",
                version: "2.0-contract",
                generated_at: $generated,
                transport_independent: true,
                selected_mode: "netlify_only_degraded",
                market_phase: (.session_status // "unknown"),
                data_sha256: $sha
              },
              path_health: {
                netlify: {
                  ok: true,
                  execution_usable: (.execution_usable == true),
                  source_id: .source_id
                },
                direct: {
                  ok: false,
                  row_count: 0,
                  error: "not_used_by_credit_guard"
                }
              },
              data: {
                execution_usable: (.execution_usable == true),
                retrieved_at: .retrieved_at,
                session_status: .session_status,
                expected_reference_session_date: .expected_reference_session_date,
                stale_risk: .stale_risk,
                blockers: (.blockers // []),
                warnings: (.warnings // []),
                quality: .quality,
                market: .market,
                screen: (
                  (.screen // {}) as $s
                  | if (($s.top_setup // null) | type) == "array"
                    then $s
                    else ($s + {top_setup: []})
                    end
                ),
                stocks: (.stocks // [])
              }
            }
          ' out/v2-raw.json > out/latest.json
          jq -e '
            .bridge.name == "EGX Resilient Bridge" and
            (.bridge.data_sha256 | type == "string" and test("^[a-f0-9]{64}$")) and
            (.data.market | type == "object") and
            (.data.screen.top_setup | type == "array") and
            ((.path_health.netlify.ok == true) or (.path_health.direct.ok == true))
          ' out/latest.json >/dev/null

      - name: Publish validated Bridge snapshot
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/egx-live
          mkdir -p /tmp/egx-live
          cp out/latest.json /tmp/egx-live/latest.json
          cp out/health.json /tmp/egx-live/health.json
          cp out/contract.json /tmp/egx-live/contract.json
          cp out/transport.json /tmp/egx-live/transport.json
          cp out/focus.json /tmp/egx-live/focus.json
          cp out/history.json /tmp/egx-live/history.json
          cd /tmp/egx-live
          git init -q
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -q -b egx-live
          git add .
          git commit -q -m "Netlify V2 transport snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin egx-live
