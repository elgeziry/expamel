name: EGX independent quote provider discovery
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['.github/workflows/egx-independent-provider-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe Mubasher EGX share quote with source update time
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request,html,re
          for symbol in ("MFPC","EFID","EGAL","JUFO","ETEL"):
            url=f"https://www.mubasher.info/markets/EGX/stocks/{symbol}"
            try:
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126.0.0.0 Safari/537.36","Accept":"text/html"})
              with urllib.request.urlopen(req,timeout=14) as resp: page=resp.read().decode("utf-8","replace"); server_date=resp.headers.get("Date")
              start=page.find("آخر تحديث")
              sample=page[start:start+1850] if start>=0 else page[:500]
              stripped=re.sub(r"\\s+"," ",html.unescape(re.sub(r"<[^>]*>"," ",sample)))
              stamps=[]
              for pat in ["lastUpdate","last.update","last_trade","lastTrade","last-update","lastupdated","2026-10-27","2026/10/27","last_price_date"]:
                z=re.search(pat,page,re.I)
                if z: stamps.append({"term":pat,"context":page[max(0,z.start()-100):z.start()+190]})
              print(json.dumps({"symbol":symbol,"server_date":server_date,"excerpt":stripped[:340],"found_html":sample[:900],"stamp_hints":stamps[:6]},ensure_ascii=False))
            except Exception as e:print(json.dumps({"symbol":symbol,"error":str(e)[:160]}))
          PY