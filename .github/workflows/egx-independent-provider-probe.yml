name: EGX independent quote provider discovery
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['.github/workflows/egx-independent-provider-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe Mubasher EGX share quote with source update time
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request,html,re
          for symbol in ("MFPC","EFID","EGAL","JUFO","ETEL"):
            url=f"https://www.mubasher.info/markets/EGX/stocks/{symbol}"
            try:
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126.0.0.0 Safari/537.36","Accept":"text/html"})
              with urllib.request.urlopen(req,timeout=14) as resp: page=resp.read().decode("utf-8","replace"); server_date=resp.headers.get("Date")
              start=page.find("آخر تحديث")
              sample=page[start:start+1850] if start>=0 else page[:500]
              stripped=re.sub(r"\\s+"," ",html.unescape(re.sub(r"<[^>]*>"," ",sample)))
              stamps=[]
              for pat in ["lastUpdate","last.update","last_trade","lastTrade","last-update","lastupdated","2026-10-27","2026/10/27","last_price_date"]:
                z=re.search(pat,page,re.I)
                if z: stamps.append({"term":pat,"context":page[max(0,z.start()-100):z.start()+190]})
              print(json.dumps({"symbol":symbol,"server_date":server_date,"excerpt":stripped[:340],"found_html":sample[:900],"stamp_hints":stamps[:6]},ensure_ascii=False))
            except Exception as e:print(json.dumps({"symbol":symbol,"error":str(e)[:160]}))
          PY

      - name: Probe EGID delayed API and DirectFN date-coded trading data
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, json, re, datetime
          urls=[
            'https://ticker.egidegypt.com/swagger/v1/swagger.json',
            'https://ticker.egidegypt.com/api/DelayedFeed/getEGXMarketWatch',
            'https://ticker.egidegypt.com/api/DelayedFeed/getTodayMarketWatch',
            'https://ticker.egidegypt.com/api/DelayedFeed/getMarketStatus',
            'https://ticker.egidegypt.com/api/DelayedFeed/getMarketSummary',
            'https://www.directfn.com.eg/tradingData.aspx',
            'https://directfn.com.eg/tradingData.aspx',
          ]
          for url in urls:
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json,text/html,*/*','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=12) as r:
                raw=r.read(450000).decode('utf-8','replace')
                status=r.status; date=r.headers.get('Date')
              try:
                data=json.loads(raw)
                structure={'type':type(data).__name__,'keys':list(data)[:30] if isinstance(data,dict) else None,'sample':str(data)[:500]}
                if url.endswith('swagger.json') and isinstance(data,dict):
                  structure={'paths':[p for p in data.get('paths',{}) if 'MarketWatch' in p or 'MarketStatus' in p][:20]}
              except Exception:
                structure={'html_sample':re.sub(r'\s+',' ',re.sub(r'<[^>]*>',' ',raw[:2200]))[:550],
                  'EGAL_present':'EGAL' in raw,'ADIB_present':'ADIB' in raw,
                  'contains_session_date':bool(re.search(r'28 (Oct|أكتوبر) 2026',raw,re.I))}
              print(json.dumps({'url':url,'status':status,'server_date':date,'bytes':len(raw),'data':structure},ensure_ascii=False))
            except Exception as e: print(json.dumps({'url':url,'error':f'{type(e).__name__}: {str(e)[:220]}'},ensure_ascii=False))
          PY


      - name: Inspect DirectFN table semantics for safe quote parser
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          import urllib.request,re,json,html
          class Tables(HTMLParser):
            def __init__(self): super().__init__();self.table=0;self.row=None;self.cell=None;self.rows=[]
            def handle_starttag(self,tag,attrs):
              if tag=='tr':self.row=[]
              if tag in ('td','th') and self.row is not None:self.cell=[]
            def handle_data(self,data):
              if self.cell is not None:self.cell.append(data)
            def handle_endtag(self,tag):
              if tag in ('td','th') and self.cell is not None and self.row is not None:
                self.row.append(' '.join(' '.join(self.cell).split()));self.cell=None
              if tag=='tr' and self.row is not None:self.rows.append(self.row);self.row=None
          u='https://www.directfn.com.eg/tradingData.aspx'
          with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'}),timeout=18) as f: h=f.read().decode('utf-8','replace');dt=f.headers.get('Date')
          p=Tables();p.feed(h)
          rows=p.rows
          for sym in ['EGAL','ADIB','EFID','MFPC','JUFO','ETEL','AMOC']:
            hits=[x for x in rows if sym in x]
            print(json.dumps({'symbol':sym,'matches':hits[:2]},ensure_ascii=False))
          print(json.dumps({'row_count':len(rows),'first_rows':rows[:12],'server_date':dt,
            'date_fragments':re.findall(r'.{0,70}(?:28 Oct 2026|28 October 2026|28/10/2026|28-10-2026|Oct 28|28 أكتوبر 2026).{0,70}',h,re.I)[:7],
            'delay_notice': bool(re.search('15 minutes late|15 minute|15 دقيقة',h,re.I)),
            'closed':bool(re.search(r'>\s*Closed\s*<',h,re.I))},ensure_ascii=False))
          PY
